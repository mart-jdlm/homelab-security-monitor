[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-security-monitor"
version = "0.1.0"
description = "Detection rules over the logs and state of a homelab server (SSH, sudo, Docker, Tailscale, listeners, file integrity)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
hsm = "hsm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
